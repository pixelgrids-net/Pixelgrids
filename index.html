<!-- METRICS HEADER -->
<div class="stats-grid">
  <div class="stat-card">
    <span class="stat-label">GRID SLOTS</span>
    <span class="stat-value">100</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">STANDAARD SLOT</span>
    <span class="stat-value">€ 49,- <small>/ 2 weken</small></span>
  </div>
  <div class="stat-card highlight">
    <span class="stat-label">MIDDELSTE SLOTS</span>
    <span class="stat-value">Hoogste Bieding</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">MAX VIDEO LENGTE</span>
    <span class="stat-value">30 sec (20s loop)</span>
  </div>
</div>

<!-- MODAL / CHECKOUT PREVIEW BIJ SELECTIE -->
<div id="slot-modal" class="modal">
  <div class="modal-content">
    <h3>Slot #35 Selecteren (Middelste Grid)</h3>
    <p class="badge-bidding">🔥 Biedingszone</p>
    <p>Upload je video (max. 30 seconden MP4) en plaats je bod voor 2 weken zendtijd.</p>
    
    <form action="/api/checkout-stripe" method="POST">
      <label>Jouw Bod (Min. €49):</label>
      <input type="number" name="bid_amount" min="49" value="49" step="5" required>
      <button type="submit" class="btn-primary">Plaats Bod via Stripe</button>
    </form>
  </div>
</div>
