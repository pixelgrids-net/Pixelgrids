<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelgrids.net - Attention Marketplace</title>
    <!-- Tailwind CSS voor styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

    <div class="max-w-4xl w-full text-center my-8">
        <h1 class="text-4xl font-extrabold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
            Pixelgrids.net
        </h1>
        <p class="text-slate-400 mt-2">10x10 Attention Marketplace - Live Grid</p>
    </div>

    <!-- Het 10x10 Grid Container -->
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-2xl">
        <div id="grid-container" class="grid grid-cols-10 gap-2 aspect-square">
            <!-- Wordt dynamisch gevuld vanuit Supabase -->
        </div>
    </div>

    <!-- Script voor Supabase data ophalen en renderen -->
    <script>
        // Supabase configuratie (gebruikt je publieke variabelen)
        const SUPABASE_URL = 'JOUW_SUPABASE_URL'; // Wordt automatisch ingevuld of haalt uit environment
        const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY';

        const { createClient } = supabase;
        const _supabase = createClient(
            window.env?.NEXT_PUBLIC_SUPABASE_URL || SUPABASE_URL, 
            window.env?.NEXT_PUBLIC_SUPABASE_ANON_KEY || SUPABASE_ANON_KEY
        );

        async function loadGridSlots() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            // Haal de data op uit de juiste 'advertisers' tabel
            const { data, error } = await _supabase.from('advertisers').select('*');

            if (error) {
                console.error('Fout bij ophalen slots:', error);
                return;
            }

            // Maak een lookup map voor snelle matching op slot_id
            const activeSlots = {};
            if (data) {
                data.forEach(item => {
                    activeSlots[item.slot_id] = item;
                });
            }

            // Genereer de 100 vakjes (10x10 grid)
            for (let i = 1; i <= 100; i++) {
                const slotDiv = document.createElement('div');
                slotDiv.className = "flex items-center justify-center bg-slate-800 border border-slate-700 rounded-lg text-xs font-bold transition hover:border-purple-500 cursor-pointer overflow-hidden relative";
                
                if (activeSlots[i]) {
                    const advertiser = activeSlots[i];
