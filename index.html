<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelgrids.net - Attention Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

    <div class="max-w-4xl w-full text-center my-8">
        <h1 class="text-4xl font-extrabold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
            Pixelgrids.net
        </h1>
        <p class="text-slate-400 mt-2">10x10 Attention Marketplace - Live Grid</p>
    </div>

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-2xl">
        <div id="grid-container" class="grid grid-cols-10 gap-2 aspect-square">
            <div class="col-span-10 flex items-center justify-center text-slate-500 text-sm">Laden van data...</div>
        </div>
    </div>

    <script>
        // Vul hier jouw echte Supabase URL en Anon Key in
        const SUPABASE_URL = 'JOUW_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY';

        async function initGrid() {
            const container = document.getElementById('grid-container');
            
            try {
                const { createClient } = supabase;
                const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // Haal data op
                const { data, error } = await _supabase.from('advertisers').select('*');

                if (error) {
                    container.innerHTML = `<div class="col-span-10 text-red-500 text-xs p-2">DB Error: ${error.message}</div>`;
                    return;
                }

                container.innerHTML = '';
                const activeSlots = {};
                if (data) {
                    data.forEach(item => {
                        activeSlots[item.slot_id] = item;
                    });
                }

                // Bouw de 100 vakjes
                for (let i = 1; i <= 100; i++) {
                    const slotDiv = document.createElement('div');
                    slotDiv.className = "flex items-center justify-center bg-slate-800 border border-slate-700 rounded-lg text-xs font-bold transition hover:border-purple-500 cursor-pointer overflow-hidden relative aspect-square";
                    
                    if (activeSlots[i]) {
                        const advertiser = activeSlots[i];
                        slotDiv.className += " bg-purple-900/40 border-purple-500";
                        slotDiv.innerHTML = `
                            <a href="${advertiser.target_url || '#'}" target="_blank" title="${advertiser.brand_name || 'Grid'}" class="w-full h-full flex flex-col items-center justify-center p-1">
                                <span class="text-xl">${advertiser.logo_emoji || '🔥'}</span>
                            </a>
                        `;
                    } else {
                        slotDiv.innerHTML = `<span class="text-slate-600">${i}</span>`;
                    }

                    container.appendChild(slotDiv);
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-10 text-red-400 text-xs p-2">Script Error: ${err.message}</div>`;
            }
        }

        initGrid();
    </script>
</body>
</html>
